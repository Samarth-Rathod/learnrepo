<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <link rel="stylesheet" href="./git.css"> 

 
</head>
<body>
 <div class="container">
<div class="screen active" id="start-screen">
  <h1> Quiz time!</h1>
  <p> general knowledge quiz</p>
  <button id="start-btn">Start Quiz </button>
</div>

<div id="screen" class="quiz-screen">
   <div class="quiz-header">
   <h2 id="question-text" > question goes here </h2>

   <div class="quiz-info">
   <p> question <span id="current-question">1</span> of <span> 5 </span> </p>
   
   <p> score: <span id="score">0</span> </p>
   
   
</div>
 </div>

 <div id="answers-container">

<!--   answer buttons here will be inserted from oud js code later at some point -->


</div>
<div class="progress-bar">
<div id="progress" class="progress">


</div>

</div>

<div id="result-screen" class="screen">
  <h1> Quiz results</h1>

  <div   class="result-info"> 

    <p> you scored <span id="final-score">0</span>out of <span id="max-score">5</span> </p>

    <div id="result-message">    
      Good job
    </div>
  


</div>

<button id="restart-btn">Restart Quiz</button>

 </div>
 
 </div>









   <script src="git.js"></script>
</body>
</html>
